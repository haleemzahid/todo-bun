<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - Bun API Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <!-- Header with User Info -->
        <div class="text-center mb-8">
            <div class="flex justify-between items-center mb-4">
                <div></div> <!-- Spacer -->
                <h1 class="text-4xl font-bold text-gray-800">Todo App</h1>
                <div class="relative">
                    <button id="userMenuBtn" class="flex items-center space-x-2 text-gray-700 hover:text-primary focus:outline-none">
                        <div class="w-8 h-8 bg-primary text-white rounded-full flex items-center justify-center font-medium" id="userAvatar">
                            U
                        </div>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <!-- User Dropdown Menu -->
                    <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 z-10">
                        <div class="px-4 py-3 border-b border-gray-200">
                            <p class="text-sm font-medium text-gray-800 truncate" id="userName" title="">User Name</p>
                            <p class="text-sm text-gray-600 truncate" id="userEmail" title="">user@example.com</p>
                        </div>
                        <a href="/profile.html" id="profileBtn" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center space-x-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                            <span>Profile Settings</span>
                        </a>
                        <button id="logoutBtn" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 rounded-b-lg">
                            Sign Out
                        </button>
                    </div>
                </div>
            </div>
            <p class="text-gray-600" id="welcomeMessage">Welcome back! Manage your personal todos below.</p>
        </div>

        <!-- Add Todo Form -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <form id="todoForm" class="flex gap-3">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="What needs to be done?" 
                    class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                    required
                >
                <button 
                    type="submit" 
                    class="px-6 py-2 bg-primary text-white rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-colors duration-200"
                >
                    Add Todo
                </button>
            </form>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-4 mb-6">
            <div class="bg-white rounded-lg shadow-md p-4 text-center">
                <div class="text-2xl font-bold text-primary" id="totalCount">0</div>
                <div class="text-sm text-gray-600">Total</div>
            </div>
            <div class="bg-white rounded-lg shadow-md p-4 text-center">
                <div class="text-2xl font-bold text-green-600" id="completedCount">0</div>
                <div class="text-sm text-gray-600">Completed</div>
            </div>
            <div class="bg-white rounded-lg shadow-md p-4 text-center">
                <div class="text-2xl font-bold text-orange-600" id="pendingCount">0</div>
                <div class="text-sm text-gray-600">Pending</div>
            </div>
        </div>

        <!-- Filter Buttons -->
        <div class="flex justify-center gap-2 mb-6">
            <!-- Search Input -->
            <div class="w-full max-w-md mb-4">
                <div class="relative">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search todos..." 
                        class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                    >
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <button 
                        id="clearSearch" 
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 hidden"
                        title="Clear search"
                    >
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <!-- Search Results Counter -->
                <div id="searchResults" class="text-sm text-gray-600 mt-2 text-center hidden">
                    <span id="searchResultsText"></span>
                </div>
            </div>
        </div>

        <!-- Filter Buttons -->
        <div class="flex justify-center gap-2 mb-6">
            <button 
                class="filter-btn px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-100 transition-colors duration-200 active" 
                data-filter="all"
            >
                All
            </button>
            <button 
                class="filter-btn px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-100 transition-colors duration-200" 
                data-filter="pending"
            >
                Pending
            </button>
            <button 
                class="filter-btn px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-100 transition-colors duration-200" 
                data-filter="completed"
            >
                Completed
            </button>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden text-center py-8">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
            <p class="mt-2 text-gray-600">Loading todos...</p>
        </div>

        <!-- Error Message -->
        <div id="error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-6">
            <p id="errorMessage"></p>
        </div>

        <!-- Todo List -->
        <div class="bg-white rounded-lg shadow-md">
            <div id="todoList" class="divide-y divide-gray-200">
                <!-- Todos will be inserted here -->
            </div>
            
            <!-- Empty State -->
            <div id="emptyState" class="text-center py-12 text-gray-500">
                <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                </svg>
                <p class="text-lg font-medium">No todos yet</p>
                <p class="text-sm">Add your first todo above to get started!</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 text-sm text-gray-500">
            <p>🚀 Built with <a href="https://bun.sh" class="text-primary hover:underline">Bun</a></p>
            <p class="mt-1">Learn API development with this hands-on project!</p>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
